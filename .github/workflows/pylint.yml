name: Pylint

on:
  push:
  pull_request:

jobs:
  pylint-database-lib:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e src/database_lib
          pip install pylint

      - name: Analyze code with pylint
        working-directory: src/database_lib
        run: |
          pylint database_lib

  pylint-web-server:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r docker/web_server/requirements.txt
          pip install -e src/database_lib
          pip install pylint

      - name: Analyze code with pylint
        working-directory: src/web_server
        run: |
          pylint .

  pylint-data-analyzer:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r docker/data_analyzer/requirements.txt
          pip install -e src/database_lib
          pip install pylint

      - name: Analyze code with pylint
        working-directory: src/data_analyzer
        run: |
          pylint .

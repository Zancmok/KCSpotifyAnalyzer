x-common-env: &common-env
  DEBUG: "true"

x-database-env: &database-env
  MYSQL_PORT: "3306"
  MYSQL_HOST: "mysql"
  MYSQL_DATABASE: "database"
  MYSQL_PASSWORD: "admin"
  MYSQL_USER: "admin"

x-upload-env: &upload-env
  UPLOAD_FOLDER: "/uploads/"

services:
  caddy:
    container_name: caddy
    build:
      context: .
      dockerfile: ./docker/caddy/Dockerfile
    env_file:
      - ./docker/caddy/.env
    ports:
      - "9005:9005"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web_server

  web_server:
    container_name: web_server
    environment:
       <<: [*common-env, *database-env, *upload-env]
       INTERNAL_PORT: "5000"
       INTERNAL_HOST: "0.0.0.0"
       SPOTIFY_REDIRECT_URI: "https://kcspotifyanalyzer.duckdns.org:9005/auth/callback"
    build:
      context: .
      dockerfile: docker/web_server/Dockerfile
    volumes:
      - uploads:/uploads

  data_analyzer:
    container_name: data_analyzer
    environment:
      <<: [*common-env, *database-env, *upload-env]
    build:
      context: .
      dockerfile: docker/data_analyzer/Dockerfile
    volumes:
      - uploads:/uploads

  mysql:
    image: mysql:8
    container_name: mysql
    environment:
      <<: [*database-env]
      MYSQL_ROOT_PASSWORD: "admin"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  caddy_data:
  caddy_config:
  mysql_data:
  uploads:
